name: Publish LLMWitness to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/llmwitness/
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build release artifacts
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          twine check dist/*

      # Trusted Publishing is enabled from the PyPI project settings.
      # Once the PyPI publisher entry is connected to this GitHub repo,
      # this action can publish without an API token.
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

