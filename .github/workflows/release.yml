name: AgentTrace Release & PyPI Publication

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    name: Build Wheel & Publish to PyPI
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip build twine

      - name: Build Source Distribution & Pure Python Wheel
        run: |
          python -m build

      - name: Validate Package Artifacts
        run: |
          twine check dist/*

      - name: Publish Package to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
