name: LLMWitness PR Flow Gate

on:
  pull_request:
    branches: [ main, integ ]

jobs:
  source-branch-policy:
    name: Enforce integ-to-main flow
    runs-on: ubuntu-latest
    steps:
      - name: Require main PRs to come from integ
        shell: bash
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            if [ "${{ github.head_ref }}" != "integ" ] || [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
              echo "Pull requests to main must come from this repository's integ branch."
              exit 1
            fi
          fi
