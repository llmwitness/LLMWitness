line-length = 120
target-version = "py310"

select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "S",   # flake8-bandit
]

ignore = [
    "S101",  # Use of assert (allowed in tests and internal checks)
    "S104",  # Possible binding to all interfaces (allowed in test server defaults)
    "S311",  # Pseudo-random generators (allowed in non-cryptographic bench/tests)
]

exclude = [
    ".git",
    "__pycache__",
    "build",
    "dist",
    "venv",
]
